<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book a TurboApply audit through Calendly." />
    <title>TurboApply — Book an Audit</title>
    <meta property="og:image" content="https://turboapply.agency/public/assets/brand/turboapply-agency-og.png?v=t-logo-20260708-1" />
    <meta property="og:image:alt" content="TurboApply Agency logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://turboapply.agency/public/assets/brand/turboapply-agency-og.png?v=t-logo-20260708-1" />
    <meta name="theme-color" content="#050607" />
    <link rel="icon" href="/favicon.ico?v=t-logo-20260708-1" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/turboapply-agency-logo.svg?v=t-logo-20260708-1" />
    <link rel="apple-touch-icon" href="/public/assets/brand/apple-touch-icon.png?v=t-logo-20260708-1" />
    <link rel="canonical" href="https://turboapply.agency/book-meeting/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --booking-black: #050607;
        --booking-cream: #f5f1e8;
        --booking-muted: rgba(245, 241, 232, 0.68);
        --booking-orange: #ff5a1f;
        --booking-display: "Montserrat", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        --booking-body: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      .booking-shell {
        margin: 0;
        min-height: 100%;
        background: #fff;
      }

      body {
        font-family: var(--booking-body);
      }

      body.free-guide-booking {
        min-height: 100vh;
        overflow-x: hidden;
        background: #fff;
        color: #fff;
      }

      body.free-guide-booking .booking-shell {
        width: 100%;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      .booking-thank-you,
      .booking-card-heading {
        display: none;
      }

      body.free-guide-booking .booking-thank-you {
        display: block;
        width: 100%;
        min-height: 268px;
        padding: 16px 20px 22px;
        background: #000;
        color: #fff;
        text-align: center;
        border-bottom: 2px solid rgba(255, 255, 255, 0.85);
      }

      .booking-thank-you-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 35px;
        color: #fff;
        font: 900 12px/0.9 var(--booking-display);
        letter-spacing: -0.04em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .booking-thank-you-logo img {
        display: block;
        width: 30px;
        height: 30px;
      }

      .booking-thank-you-logo span {
        width: 54px;
        text-align: left;
      }

      .booking-eyebrow {
        margin: 22px 0 18px;
        color: #2aa8f2;
        font: 800 13px/1 var(--booking-display);
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .booking-thank-you h1 {
        max-width: 900px;
        margin: 0 auto;
        font: 800 clamp(28px, 2.85vw, 36px)/1.05 var(--booking-display);
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .booking-thank-you p:not(.booking-eyebrow) {
        max-width: 460px;
        margin: 16px auto 0;
        color: rgba(255, 255, 255, 0.86);
        font: 400 16px/1.35 var(--booking-display);
        letter-spacing: -0.01em;
      }

      body.free-guide-booking .booking-card {
        background: #fff;
        color: #071018;
      }

      #calendly-inline-widget {
        min-width: 320px;
        height: 100vh;
        min-height: 700px;
      }

      body.free-guide-booking #calendly-inline-widget {
        height: 100vh;
        min-height: 700px;
        background: #fff;
      }

      .fallback {
        display: none;
        padding: 24px;
      }

      .fallback-link {
        color: #071018;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        body.free-guide-booking .booking-shell {
          width: 100%;
          margin: 0;
          padding: 0;
        }

        body.free-guide-booking .booking-thank-you {
          min-height: 292px;
          padding: 14px 18px 24px;
        }

        .booking-eyebrow {
          margin-top: 21px;
          margin-bottom: 16px;
          font-size: 11px;
        }

        .booking-thank-you h1 {
          max-width: 350px;
          font-size: clamp(25px, 7.7vw, 32px);
          line-height: 1.08;
          letter-spacing: -0.035em;
        }

        .booking-thank-you p:not(.booking-eyebrow) {
          max-width: 330px;
          margin-top: 15px;
          font-size: 15px;
          line-height: 1.35;
        }
      }
    </style>
  </head>
  <body>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const isFreeGuideBooking = params.get("source") === "free-guide" || params.get("thankyou") === "1";
        if (isFreeGuideBooking) document.body.classList.add("free-guide-booking");
      })();
    </script>
    <main class="booking-shell">
      <header class="booking-thank-you" aria-labelledby="booking-thank-you-title">
        <a class="booking-thank-you-logo" href="/" aria-label="TurboApply home">
          <img src="/public/assets/brand/turboapply-agency-logo.svg?v=t-logo-20260708-1" alt="" aria-hidden="true" />
          <span>TurboApply</span>
        </a>
        <p class="booking-eyebrow">Your guide is on the way</p>
        <h1 id="booking-thank-you-title">Book A Free 15 Minute Call And We'll Show You How To Improve Your Lead Quality</h1>
        <p>Your guide is on the way. The call is the fastest way to put it to work.</p>
      </header>

      <section class="booking-card" aria-label="Calendly booking">
        <div id="calendly-inline-widget" aria-label="Calendly scheduling widget"></div>
        <p class="fallback" id="calendly-fallback">
          If the scheduler does not load,
          <a class="fallback-link" id="calendly-fallback-link" href="https://calendly.com/turboapply/30min">open Calendly directly</a>.
        </p>
      </section>
    </main>

    <script>
      const CALENDLY_URL = "https://calendly.com/turboapply/30min";
      const query = new URLSearchParams(window.location.search);
      const prefill = {};
      const name = (query.get("name") || "").trim();
      const email = (query.get("email") || "").trim();

      if (name) prefill.name = name;
      if (email) prefill.email = email;

      const directUrl = new URL(CALENDLY_URL);
      if (name) directUrl.searchParams.set("name", name);
      if (email) directUrl.searchParams.set("email", email);
      document.getElementById("calendly-fallback-link").href = directUrl.toString();

      const showFallback = () => {
        document.getElementById("calendly-fallback").style.display = "block";
      };

      const initCalendly = () => {
        const parentElement = document.getElementById("calendly-inline-widget");

        if (!window.Calendly || !parentElement) {
          showFallback();
          return;
        }

        window.Calendly.initInlineWidget({
          url: CALENDLY_URL,
          parentElement,
          prefill
        });
      };

      window.addEventListener("error", showFallback, { once: true });
      setTimeout(() => {
        if (!document.querySelector("#calendly-inline-widget iframe")) showFallback();
      }, 5000);
    </script>
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async onload="initCalendly()"></script>
  </body>
</html>
