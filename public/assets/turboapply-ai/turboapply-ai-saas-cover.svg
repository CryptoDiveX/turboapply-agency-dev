<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1821" viewBox="0 0 1400 1821" role="img" aria-labelledby="title desc">
  <title id="title">TurboApply AI SaaS cover</title>
  <desc id="desc">Abstract product interface for a job seeker SaaS application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ea"/>
      <stop offset="0.48" stop-color="#e8f0f4"/>
      <stop offset="1" stop-color="#dbe6f0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="1" stop-color="#26313b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="1821" rx="82" fill="url(#bg)"/>
  <circle cx="1120" cy="230" r="210" fill="#fff" opacity="0.56"/>
  <circle cx="250" cy="1480" r="330" fill="#c8d7e2" opacity="0.48"/>
  <g transform="translate(98 112)">
    <rect x="0" y="0" width="1204" height="1597" rx="70" fill="#fff" opacity="0.72"/>
    <text x="80" y="150" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#2b3137">TURBOAPPLY.AI</text>
    <text x="80" y="275" font-family="Urbanist, Inter, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-7" fill="#101112">SaaS for</text>
    <text x="80" y="410" font-family="Urbanist, Inter, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-7" fill="#101112">job seekers</text>
    <text x="82" y="505" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#5c6470">Track opportunities, organize applications, and keep the search moving.</text>
    <g transform="translate(82 650)" filter="url(#shadow)">
      <rect x="0" y="0" width="1040" height="610" rx="52" fill="url(#ink)"/>
      <rect x="56" y="56" width="928" height="86" rx="28" fill="#f5f1e8" opacity="0.12"/>
      <text x="90" y="111" font-family="Inter, Arial, sans-serif" font-size="28" fill="#f5f1e8">Application workspace</text>
      <g transform="translate(58 198)">
        <rect width="280" height="300" rx="34" fill="#f7f4ea"/>
        <text x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111">Saved roles</text>
        <rect x="34" y="112" width="210" height="22" rx="11" fill="#aebdff"/>
        <rect x="34" y="158" width="160" height="22" rx="11" fill="#d5dccf"/>
        <rect x="34" y="204" width="196" height="22" rx="11" fill="#f0c98b"/>
      </g>
      <g transform="translate(380 198)">
        <rect width="280" height="300" rx="34" fill="#f7f4ea"/>
        <text x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111">In progress</text>
        <rect x="34" y="112" width="190" height="22" rx="11" fill="#d5dccf"/>
        <rect x="34" y="158" width="220" height="22" rx="11" fill="#aebdff"/>
        <rect x="34" y="204" width="138" height="22" rx="11" fill="#f0c98b"/>
      </g>
      <g transform="translate(702 198)">
        <rect width="280" height="300" rx="34" fill="#f7f4ea"/>
        <text x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111">Next steps</text>
        <rect x="34" y="112" width="170" height="22" rx="11" fill="#f0c98b"/>
        <rect x="34" y="158" width="216" height="22" rx="11" fill="#d5dccf"/>
        <rect x="34" y="204" width="150" height="22" rx="11" fill="#aebdff"/>
      </g>
    </g>
    <g transform="translate(82 1355)">
      <rect width="330" height="92" rx="46" fill="#111"/>
      <text x="62" y="58" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">TurboApply AI</text>
      <rect x="442" y="0" width="290" height="92" rx="46" fill="#fff" stroke="#cdd3da"/>
      <text x="500" y="58" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111">Job search</text>
    </g>
